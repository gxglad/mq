<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站内检索 · 江苏省张家港中等专业学校</title>
<link rel="icon" href="assets/icons/favicon.png" type="image/png">
<link rel="stylesheet" href="css/main.css">
</head>
<body data-page="search">
<div class="topbar" data-shell="top"></div>
<header class="masthead" data-shell="masthead"></header>
<nav class="nav" data-shell="nav"></nav>

<section class="page-hd" style="height:200px;background-image:url(assets/images/news-01.jpg)">
  <div class="wrap">
    <h1>站内检索</h1>
    <div class="crumb"><a href="index.html">首页</a> › 站内检索</div>
  </div>
</section>

<div class="wrap" style="padding:34px 0 60px">
  <div class="card" style="padding:22px">
    <form action="search.html" method="get" style="display:flex;gap:10px">
      <input id="searchPageInput" name="q" type="search" placeholder="输入关键词，例如：技能大赛、计算机网络技术、招生"
             style="flex:1;height:44px;border:1px solid var(--line);border-radius:4px;padding:0 14px;outline:none">
      <button class="btn btn-primary" style="height:44px" type="submit">检索</button>
    </form>
    <div style="margin-top:14px;font-size:13px;color:var(--ink-3)">
      普通检索一次只返回一个关键词的结果。如果需要同时查多项内容，请使用 <a href="ai.html" style="color:var(--blue)">AI 快速任务台</a>。
    </div>
  </div>

  <div class="card" style="padding:22px;margin-top:18px">
    <div id="searchCount" style="font-size:13.5px;color:var(--ink-3);margin-bottom:6px"></div>
    <div data-search-result></div>
  </div>
</div>

<footer class="footer" data-shell="footer"></footer>
<script src="js/data.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
