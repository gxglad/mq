<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园地图 · 江苏省张家港中等专业学校</title>
<meta name="description" content="可交互校园平面图：找楼、看功能、算步行路线。">
<link rel="icon" href="assets/icons/favicon.png" type="image/png">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/campus.css">
</head>
<body data-page="campus">
<div class="topbar" data-shell="top"></div>
<header class="masthead" data-shell="masthead"></header>
<nav class="nav" data-shell="nav"></nav>

<div class="map-wrap">
  <div class="map-main">
    <div class="map-bar">
      <div class="map-title">
        <h1>校园地图</h1>
        <span>新校区 · 福新路 2 号 · 占地 360 亩</span>
      </div>
      <div class="map-tools">
        <input id="mapSearch" type="search" placeholder="搜索楼栋，如：数控、图书馆">
        <button type="button" id="zoomIn" title="放大">＋</button>
        <button type="button" id="zoomOut" title="缩小">－</button>
        <button type="button" id="zoomReset" title="复位">复位</button>
        <button type="button" id="fullBtn" title="全屏">全屏</button>
      </div>
    </div>

    <div class="map-canvas" id="mapCanvas">
      <svg id="campusSvg" viewBox="0 0 1778 810" preserveAspectRatio="xMidYMid meet" role="img" aria-label="校园平面图">
        <defs id="svgDefs"></defs>
        <g id="layerGround"></g>
        <g id="layerRoads"></g>
        <g id="layerAreas"></g>
        <g id="layerBuildings"></g>
        <g id="layerLabels"></g>
        <g id="layerRoute"></g>
      </svg>
      <div class="map-tip" id="mapTip"></div>
      <div class="map-legend">
        <div class="lg-title">图例</div>
        <div class="lg-item"><i style="background:#cfdcec"></i>教学楼</div>
        <div class="lg-item"><i style="background:#c9d8e8"></i>实训基地</div>
        <div class="lg-item"><i style="background:#e6ddcc"></i>生活服务</div>
        <div class="lg-item"><i style="background:#cfe3d4"></i>体育场馆</div>
        <div class="lg-item"><i style="background:#d6dce8"></i>行政办公</div>
        <div class="lg-item"><i style="background:#dcefdc"></i>绿地</div>
        <div class="lg-item"><i style="background:#bfe4f5"></i>水面</div>
      </div>
      <div class="map-north"><span>北</span><i></i></div>
    </div>

    <div class="map-bottom">
      <div class="chips-row" id="catChips"></div>
      <div class="route-row">
        <label>从</label>
        <select id="fromSel"></select>
        <label>到</label>
        <select id="toSel"></select>
        <button type="button" class="btn-mini primary" id="routeBtn">算步行路线</button>
        <button type="button" class="btn-mini" id="routeClear">清除</button>
        <span class="route-info" id="routeInfo"></span>
      </div>
    </div>
  </div>

  <aside class="map-side">
    <div class="side-card" id="detailCard">
      <div class="side-empty">
        <h3>选一栋楼看看</h3>
        <p>点击地图上的建筑，这里会显示它的功能、所属系部和开放时间。</p>
        <p class="hint">也可以用上面的搜索框输入「数控」「图书馆」「宿舍」快速定位。</p>
      </div>
    </div>
    <div class="side-card list-card">
      <div class="list-hd">楼栋一览 <em id="listCount"></em></div>
      <div class="list-body" id="buildList"></div>
    </div>
  </aside>
</div>

<footer class="footer" data-shell="footer"></footer>

<script src="js/data.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
<script src="js/campus.js"></script>
</body>
</html>
